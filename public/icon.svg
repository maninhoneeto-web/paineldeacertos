<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner border glow -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-opacity="0.3" />

  <!-- Central Symbol: Balance / Ledger / Check & Currency -->
  <g filter="url(#shadow)" transform="translate(40, 40)">
    <!-- Main white card -->
    <rect x="66" y="56" width="300" height="320" rx="36" fill="#ffffff" fill-opacity="0.96" />
    
    <!-- Top card accent bar -->
    <path d="M 66 92 C 66 72 82 56 102 56 L 330 56 C 350 56 366 72 366 92 L 366 116 L 66 116 Z" fill="url(#accentGrad)" />

    <!-- Ledger lines -->
    <rect x="106" y="150" width="130" height="18" rx="9" fill="#047857" />
    <rect x="256" y="150" width="70" height="18" rx="9" fill="#10b981" />

    <rect x="106" y="196" width="100" height="18" rx="9" fill="#64748b" />
    <rect x="236" y="196" width="90" height="18" rx="9" fill="#ef4444" fill-opacity="0.85" />

    <rect x="106" y="242" width="120" height="18" rx="9" fill="#64748b" />
    <rect x="246" y="242" width="80" height="18" rx="9" fill="#10b981" />

    <!-- Divider -->
    <line x1="106" y1="284" x2="326" y2="284" stroke="#e2e8f0" stroke-width="3" stroke-dasharray="6,6" />

    <!-- Total highlight badge -->
    <rect x="106" y="306" width="220" height="42" rx="21" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2" />
    <text x="216" y="333" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#065f46" text-anchor="middle">R$ ACERTO</text>
  </g>

  <!-- Glowing Checkmark / Balance badge at bottom-right corner -->
  <circle cx="396" cy="396" r="64" fill="#10b981" stroke="#ffffff" stroke-width="8" filter="url(#shadow)" />
  <path d="M372 396 L388 412 L422 376" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
</svg>
